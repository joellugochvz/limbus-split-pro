# Pipeline de CI para Limbus Split Pro.
name: build-windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LimbusSplitPro.sln

      - name: Build Release
        run: dotnet build LimbusSplitPro.sln -c Release --no-restore

      - name: Unit + integration tests
        shell: pwsh
        run: |
          $output = dotnet test tests/LimbusSplitPro.Tests/LimbusSplitPro.Tests.csproj -c Release 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            $lines = ($output -split "`r?`n" | Select-Object -Last 50)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::TESTFAIL%0A$escaped"
            exit $LASTEXITCODE
          }

      - name: Ensamblar runtime Python embebido (reproducible, verificado)
        shell: pwsh
        run: |
          try {
            ./runtime/python-embed/Assemble-PythonEmbed.ps1
            $prov = Get-Content ./runtime/python-embed/dist/PROVENANCE.json -Raw
            $oneline = ($prov -replace "`r?`n", " ")
            Write-Output "::notice::PYTHON_PROVENANCE $oneline"
          } catch {
            $errMsg = $_ | Out-String
            $lines = ($errMsg -split "`r?`n" | Select-Object -Last 40)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::PYEMBED_FAIL%0A$escaped"
            exit 1
          }

      - name: Instalar y empaquetar DLLs del Visual C++ Redistributable
        shell: pwsh
        run: |
          # numpy (y por extension tensorflow) fallan al importar en una maquina sin
          # Visual Studio/VC++ Redistributable instalado, con "DLL load failed" (error
          # real reportado en pruebas). El runtime embebido NO trae estas DLLs por
          # diseno. Se instala el redistributable oficial de Microsoft en este runner
          # (que aun no lo tiene por defecto para esta version) y se copian las DLLs
          # resultantes junto a python.exe, para que el orden de busqueda de DLL de
          # Windows las encuentre localmente sin requerir NINGUNA instalacion en la
          # maquina del usuario final (seccion 23: "Arranque sin Visual Studio instalado").
          try {
            $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
            Invoke-WebRequest -Uri $url -OutFile "vc_redist.x64.exe" -UseBasicParsing
            $hash = (Get-FileHash -Path "vc_redist.x64.exe" -Algorithm SHA256).Hash.ToLower()
            Write-Output "::notice::VCREDIST_HASH sha256=$hash url=$url"

            Start-Process -FilePath "./vc_redist.x64.exe" -ArgumentList "/install", "/quiet", "/norestart" -Wait -PassThru | Out-Null

            $dllNames = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "concrt140.dll", "vccorlib140.dll")
            $destDir = "runtime/python-embed/dist"
            $copied = @()
            foreach ($name in $dllNames) {
              $found = Get-ChildItem -Path "C:\Windows\System32" -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                Copy-Item -Force $found.FullName (Join-Path $destDir $name)
                $copied += $name
              }
            }
            if ($copied.Count -eq 0) { throw "No se encontro ninguna DLL del VC++ Redistributable tras la instalacion." }
            Write-Output "::notice::VCREDIST_DLLS_COPIED $($copied -join ', ')"
          } catch {
            $errMsg = $_ | Out-String
            $lines = ($errMsg -split "`r?`n" | Select-Object -Last 40)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::VCREDIST_FAIL%0A$escaped"
            exit 1
          }

      - name: Subir runtime Python embebido como artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-embed-runtime
          path: runtime/python-embed/dist/
          retention-days: 14

      - name: Instalar Spleeter en el runtime embebido
        shell: pwsh
        run: |
          $py = "runtime/python-embed/dist/python.exe"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py" -UseBasicParsing
          $pipBootstrapOutput = & $py get-pip.py --no-warn-script-location 2>&1 | Out-String
          Write-Host $pipBootstrapOutput
          if ($LASTEXITCODE -ne 0) {
            $lines = ($pipBootstrapOutput -split "`r?`n" | Select-Object -Last 60)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::PIP_BOOTSTRAP_FAIL%0A$escaped"
            exit 1
          }
          # Spleeter 2.4.2 fija tensorflow-io-gcs-filesystem==0.32.0 en su propia lista de
          # dependencias (verificado via PyPI JSON API: pypi.org/pypi/spleeter/2.4.2/json),
          # version que nunca publico wheel de Windows (problema conocido y documentado del
          # ecosistema TensorFlow, no un error de este script). Se instala Spleeter sin
          # resolver sus dependencias automaticamente, y luego se instalan manualmente con
          # tensorflow-io-gcs-filesystem fijado a la ultima version que si tiene wheel de
          # Windows. La lista de dependencias reales (sin adivinar) es:
          # ffmpeg-python, httpx[http2], typer, tensorflow-io-gcs-filesystem, tensorflow,
          # pandas, norbert, numpy. (musdb/museval son solo del extra "evaluation", no
          # necesarios para separar).
          $noDepsOutput = & $py -m pip install --no-warn-script-location "spleeter==2.4.2" --no-deps 2>&1 | Out-String
          Write-Host $noDepsOutput
          if ($LASTEXITCODE -ne 0) {
            $lines = ($noDepsOutput -split "`r?`n" | Select-Object -Last 60)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::SPLEETER_NODEPS_FAIL%0A$escaped"
            exit 1
          }

          $depsOutput = & $py -m pip install --no-warn-script-location `
            "tensorflow-io-gcs-filesystem==0.31.0" `
            "tensorflow==2.12.1" `
            "ffmpeg-python<0.3.0,>=0.2.0" `
            "httpx[http2]<0.20.0,>=0.19.0" `
            "typer<0.4.0,>=0.3.2" `
            "pandas<2.0.0,>=1.3.0" `
            "norbert<0.3.0,>=0.2.1" `
            "numpy<2.0.0" 2>&1 | Out-String
          Write-Host $depsOutput
          if ($LASTEXITCODE -ne 0) {
            $lines = ($depsOutput -split "`r?`n" | Select-Object -Last 80)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::SPLEETER_DEPS_FAIL%0A$escaped"
            exit 1
          }
          Write-Output "::notice::SPLEETER_INSTALL_OK"

          # Diagnostico real: verificar si numpy\.libs (contiene el DLL de OpenBLAS,
          # ~35MB) existe justo despues de instalar, ANTES de empaquetar nada. Esto
          # distingue si el archivo nunca se genero (bug de instalacion en si) o si
          # algo lo borra despues en la maquina del usuario final (ej. antivirus
          # poniendo en cuarentena el DLL por falso positivo, problema real y
          # documentado en el ecosistema numpy/scipy en Windows).
          $libsDir = "runtime/python-embed/dist/Lib/site-packages/numpy/.libs"
          if (Test-Path $libsDir) {
            $files = Get-ChildItem -Path $libsDir -File
            $summary = ($files | ForEach-Object { "$($_.Name)=$($_.Length)bytes" }) -join ", "
            Write-Output "::notice::NUMPY_LIBS_CHECK presente. Archivos: $summary"
          } else {
            Write-Output "::error::NUMPY_LIBS_CHECK la carpeta numpy\.libs NO existe justo despues de instalar (antes de empaquetar). El problema es de instalacion, no del antivirus del usuario."
          }

      - name: Descargar y verificar modelo 4stems de Spleeter
        shell: pwsh
        run: |
          try {
            $url = "https://github.com/deezer/spleeter/releases/download/v1.4.0/4stems.tar.gz"
            $dest = "models-download/4stems.tar.gz"
            New-Item -ItemType Directory -Force -Path "models-download" | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLower()
            $size = (Get-Item $dest).Length
            Write-Output "::notice::SPLEETER_4STEMS_HASH sha256=$hash size=$size url=$url"
            New-Item -ItemType Directory -Force -Path "legal/models/spleeter/4stems" | Out-Null
            tar -xzf $dest -C "legal/models/spleeter/4stems"
          } catch {
            $errMsg = $_ | Out-String
            $lines = ($errMsg -split "`r?`n" | Select-Object -Last 40)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::MODEL_DOWNLOAD_FAIL%0A$escaped"
            exit 1
          }

      - name: Subir modelo Spleeter descargado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: spleeter-4stems-model
          path: legal/models/spleeter/4stems/
          retention-days: 14

      - name: Descargar y verificar FFmpeg estatico (LGPL) para Windows
        shell: pwsh
        run: |
          # Spleeter usa el binario ffmpeg por linea de comandos para leer/escribir audio.
          # Sin el, el subproceso puede quedarse colgado indefinidamente sin ningun error
          # visible (comportamiento real reportado en deezer/spleeter#819). Se usa la
          # variante LGPL de BtbN/FFmpeg-Builds (no GPL, para no comprometer la
          # redistribucion en una app de codigo cerrado - seccion 12/13 del encargo).
          try {
            $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip"
            $dest = "ffmpeg-download.zip"
            Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLower()
            Write-Output "::notice::FFMPEG_HASH sha256=$hash url=$url"
            Expand-Archive -Path $dest -DestinationPath "ffmpeg-extracted" -Force
            $ffmpegExe = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
            if (-not $ffmpegExe) { throw "No se encontro ffmpeg.exe dentro del archivo descargado." }
            $ffprobeExe = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
            if (-not $ffprobeExe) { throw "No se encontro ffprobe.exe dentro del archivo descargado." }
            New-Item -ItemType Directory -Force -Path "runtime/ffmpeg" | Out-Null
            Copy-Item -Force $ffmpegExe.FullName "runtime/ffmpeg/ffmpeg.exe"
            Copy-Item -Force $ffprobeExe.FullName "runtime/ffmpeg/ffprobe.exe"
            # Licencia LGPL: copiar tambien el aviso de licencia incluido en el paquete.
            $licenseFile = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "LICENSE*" | Select-Object -First 1
            if ($licenseFile) { Copy-Item -Force $licenseFile.FullName "runtime/ffmpeg/FFMPEG-LICENSE.txt" }
            Write-Output "::notice::FFMPEG_OK"
          } catch {
            $errMsg = $_ | Out-String
            $lines = ($errMsg -split "`r?`n" | Select-Object -Last 40)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::FFMPEG_DOWNLOAD_FAIL%0A$escaped"
            exit 1
          }

      - name: Verificar arquitectura de binarios (x64)
        run: |
          echo "Pendiente: scripts/Verify-BinaryArchitecture.ps1"

      - name: Verificar manifiesto de modelos (fail-closed)
        run: |
          echo "Pendiente: scripts/Verify-ModelManifest.ps1"

      - name: Generar SBOM (CycloneDX)
        run: |
          echo "Pendiente: integracion CycloneDX"

      - name: Publicar build portable (self-contained win-x64)
        run: |
          dotnet publish src/LimbusSplitPro.App/LimbusSplitPro.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o publish/LimbusSplitPro
          # Empaquetar el runtime Python, el motor, y los modelos verificados junto al
          # exe para que "Separar y exportar" pueda invocarlos de verdad en la build
          # descargable (incluye legal/model-manifest.json y legal/models/spleeter/4stems,
          # generados en los pasos anteriores de este mismo job).
          Copy-Item -Recurse -Force engine-py publish/LimbusSplitPro/engine-py
          New-Item -ItemType Directory -Force -Path publish/LimbusSplitPro/runtime/python-embed | Out-Null
          Copy-Item -Recurse -Force runtime/python-embed/dist publish/LimbusSplitPro/runtime/python-embed/dist
          New-Item -ItemType Directory -Force -Path publish/LimbusSplitPro/legal | Out-Null
          Copy-Item -Force legal/model-manifest.json publish/LimbusSplitPro/legal/model-manifest.json
          Copy-Item -Recurse -Force legal/models publish/LimbusSplitPro/legal/models
          New-Item -ItemType Directory -Force -Path publish/LimbusSplitPro/runtime/ffmpeg | Out-Null
          Copy-Item -Recurse -Force runtime/ffmpeg/* publish/LimbusSplitPro/runtime/ffmpeg/

          # Diagnostico real: verificar si el DLL de OpenBLAS sobrevivio el Copy-Item -Recurse
          # hacia la carpeta que se empaqueta. Esto aisla si el problema esta en este paso
          # especifico o en el propio actions/upload-artifact / la descarga del usuario.
          $publishedLibsDir = "publish/LimbusSplitPro/runtime/python-embed/dist/Lib/site-packages/numpy/.libs"
          if (Test-Path $publishedLibsDir) {
            $files = Get-ChildItem -Path $publishedLibsDir -File
            $summary = ($files | ForEach-Object { "$($_.Name)=$($_.Length)bytes" }) -join ", "
            Write-Output "::notice::NUMPY_LIBS_AFTER_COPY presente. Archivos: $summary"
          } else {
            Write-Output "::error::NUMPY_LIBS_AFTER_COPY la carpeta NO existe despues de Copy-Item -Recurse. El problema esta en este paso de copia."
          }

      - name: Instalar PyTorch y Demucs (SOLO uso personal, repo privado)
        shell: pwsh
        run: |
          # Demucs es SOLO para esta build de desarrollo personal (repo privado,
          # nunca distribuido publicamente). Licencia de pesos no confirmada
          # (docs/01-modelos-licencias.md). Se instala sin resolver dependencias
          # automaticamente, igual que con Spleeter, para controlar version de torch.
          $py = "runtime/python-embed/dist/python.exe"

          $noDepsOutput = & $py -m pip install --no-warn-script-location "demucs==4.1.0" --no-deps 2>&1 | Out-String
          Write-Host $noDepsOutput
          if ($LASTEXITCODE -ne 0) {
            $lines = ($noDepsOutput -split "`r?`n" | Select-Object -Last 60)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::DEMUCS_NODEPS_FAIL%0A$escaped"
            exit 1
          }

          $depsOutput = & $py -m pip install --no-warn-script-location `
            "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu 2>&1 | Out-String
          Write-Host $depsOutput
          if ($LASTEXITCODE -ne 0) {
            $lines = ($depsOutput -split "`r?`n" | Select-Object -Last 80)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::TORCH_INSTALL_FAIL%0A$escaped"
            exit 1
          }

          $depsOutput2 = & $py -m pip install --no-warn-script-location `
            "einops" "huggingface-hub" "julius>=0.2.3" "lameenc>=1.2" "pyyaml" `
            "safetensors" "sphn>=0.1.12" "tqdm" 2>&1 | Out-String
          Write-Host $depsOutput2
          if ($LASTEXITCODE -ne 0) {
            $lines = ($depsOutput2 -split "`r?`n" | Select-Object -Last 80)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::DEMUCS_DEPS_FAIL%0A$escaped"
            exit 1
          }
          Write-Output "::notice::DEMUCS_INSTALL_OK"

      - name: Descargar y verificar modelo htdemucs_6s (forzado, hash real)
        shell: pwsh
        run: |
          $py = "runtime/python-embed/dist/python.exe"
          $torchHome = "$PWD/legal/models/demucs"
          New-Item -ItemType Directory -Force -Path $torchHome | Out-Null
          $env:TORCH_HOME = $torchHome
          $env:PYTHONPATH = "engine-py"

          $downloadOutput = & $py -c "from demucs.pretrained import get_model; get_model('htdemucs_6s'); print('MODEL_DOWNLOADED')" 2>&1 | Out-String
          Write-Host $downloadOutput
          if ($LASTEXITCODE -ne 0 -or $downloadOutput -notmatch "MODEL_DOWNLOADED") {
            $lines = ($downloadOutput -split "`r?`n" | Select-Object -Last 60)
            $escaped = ($lines -join "%0A")
            Write-Output "::error::DEMUCS_MODEL_DOWNLOAD_FAIL%0A$escaped"
            exit 1
          }

          $modelFiles = Get-ChildItem -Path $torchHome -Recurse -File
          $summary = ($modelFiles | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$($_.Name)=$hash(${($_.Length)}bytes)"
          }) -join "; "
          Write-Output "::notice::DEMUCS_MODEL_HASHES $summary"

      - name: Subir modelo Demucs como artifact (privado)
        uses: actions/upload-artifact@v4
        with:
          name: demucs-htdemucs6s-model
          path: legal/models/demucs/
          retention-days: 14

      - name: Comprimir el artefacto manualmente (evita bug conocido de actions/upload-artifact con carpetas ocultas como numpy\.libs)
        shell: pwsh
        run: |
          Compress-Archive -Path publish/LimbusSplitPro/* -DestinationPath LimbusSplitPro-dev-build.zip -CompressionLevel Optimal
          $zipEntry = [System.IO.Compression.ZipFile]::OpenRead("LimbusSplitPro-dev-build.zip").Entries |
            Where-Object { $_.FullName -like "*numpy*.libs*openblas*" }
          if ($zipEntry) {
            Write-Output "::notice::ZIP_CONTAINS_OPENBLAS $($zipEntry.FullName) = $($zipEntry.Length) bytes"
          } else {
            Write-Output "::error::ZIP_MISSING_OPENBLAS El DLL de OpenBLAS tampoco quedo dentro del zip manual."
          }

      - name: Subir artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: LimbusSplitPro-dev-build
          path: LimbusSplitPro-dev-build.zip
          retention-days: 14

      - name: Construir instalador (WiX v5)
        run: |
          echo "Pendiente: build MSI"

      - name: Firma Authenticode
        if: false
        run: |
          echo "Firma deshabilitada: no hay certificado de firma de codigo disponible."

      - name: Publicar hashes de artefactos
        run: |
          echo "Pendiente: publicacion de checksums SHA-256"
